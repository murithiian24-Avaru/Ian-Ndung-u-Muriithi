# AdLease validation: lockfile, static analysis, tests, formatting, an Android
# DEBUG build, and the admin dashboard build. It never deploys, signs a
# release, or uses repository secrets. Each job posts a plain-text report as a
# separate check ("AdLease report ...") on the commit. The debug APK is kept as
# a run artifact for 14 days.
name: AdLease CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths: ['adlease/**', '.github/workflows/adlease-ci.yml']
  pull_request:
    paths: ['adlease/**', '.github/workflows/adlease-ci.yml']
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # only to post the text reports as checks on the commit

concurrency:
  group: adlease-ci-${{ github.ref }}
  # Every commit on main keeps its own result; on other branches a newer push
  # replaces a run still in progress.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Flutter 3.27.4 was removed after 3.47.8 passed analyze, test and build.
        flutter: ['3.47.8']
    defaults:
      run:
        working-directory: adlease
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Versions
        run: |
          set -o pipefail
          { flutter --version; java -version 2>&1 | head -1; } | tee ../versions.txt

      - name: Committed lockfile (flutter pub get --enforce-lockfile)
        id: lock
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee ../lock.txt

      - name: Dependencies
        id: pub
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ steps.lock.outcome }}" != success ]; then
            # The committed lock does not match pubspec.yaml for this Flutter:
            # re-resolve here (this runner only) so the remaining checks still
            # run; the new lock is posted in a separate check for review.
            flutter pub upgrade 2>&1 | tee ../pub.txt
          else
            echo "Using the committed pubspec.lock" | tee ../pub.txt
          fi
          flutter gen-l10n 2>&1 | tee -a ../pub.txt

      - name: flutter analyze
        id: analyze
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.txt

      - name: flutter test
        id: test
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded --file-reporter json:../test.json 2>&1 | tee ../test.txt

      - name: Summarise tests
        if: always() && steps.pub.outcome == 'success'
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os
          tests, failures, prints = {}, [], []
          if os.path.exists('test.json'):
              for line in open('test.json'):
                  try: e = json.loads(line)
                  except ValueError: continue
                  t = e.get('type')
                  if t == 'testStart': tests[e['test']['id']] = {'name': e['test']['name'], 'msgs': []}
                  elif t in ('print', 'error') and e.get('testID') in tests:
                      tests[e['testID']]['msgs'].append(e.get('message') or e.get('error', ''))
                      if t == 'print' and 'LAYOUT SURVEY' in (e.get('message') or ''): prints.append(e['message'])
                  elif t == 'testDone' and e.get('testID') in tests:
                      d = tests[e['testID']]; d['result'] = e['result']; d['skipped'] = e.get('skipped', False); d['hidden'] = e.get('hidden', False)
          done = [d for d in tests.values() if 'result' in d and not d.get('hidden')]
          failed = [d for d in done if d['result'] != 'success']
          skipped = [d for d in done if d.get('skipped')]
          with open('test-summary.txt', 'w') as f:
              f.write(f"tests: {len(done)}  passed: {len(done) - len(failed) - len(skipped)}  failed: {len(failed)}  skipped: {len(skipped)}\n")
              for d in failed[:40]:
                  f.write(f"\nFAILED: {d['name']}\n")
                  for m in d['msgs'][:2]:
                      lines = [l for l in m.splitlines() if l.strip() and not l.startswith('══')]
                      f.write('\n'.join(lines[:12]) + '\n')
          with open('layout-survey.txt', 'w') as f:
              f.write('\n'.join(prints) or '(survey not run)')
          PY

      - name: flutter build apk --debug
        id: build
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ../build.txt
          apk=build/app/outputs/flutter-apk/app-debug.apk
          ls -l "$apk" | tee -a ../build.txt
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$bt/aapt2" dump badging "$apk" \
            | grep -iE "^package:|sdkVersion|^application-label:" | tee ../sdk.txt

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: adlease-debug-apk-flutter-${{ matrix.flutter }}
          path: adlease/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Screenshots (only when the commit message contains [screenshots])
        id: shots
        if: steps.pub.outcome == 'success' && contains(github.event.head_commit.message, '[screenshots]')
        continue-on-error: true
        run: |
          set -o pipefail
          export ADLEASE_SCREENSHOT_DIR="$PWD/build/screenshots"
          flutter test test/screenshots_test.dart 2>&1 | tail -15 | tee ../shots.txt
          ls -l build/screenshots | tee -a ../shots.txt

      - name: Upload screenshots
        if: always() && steps.shots.outcome != 'skipped' && steps.shots.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: adlease-screenshots
          path: adlease/build/screenshots
          retention-days: 14

      - name: Post screenshots as checks
        if: always() && steps.shots.outcome != 'skipped' && steps.shots.outcome != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          mkdir -p shots
          for f in adlease/build/screenshots/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png)
            convert "$f" -quality 72 "shots/$n.jpg"
            base64 -w 0 "shots/$n.jpg" > "shots/$n.b64"
            split -b 60000 -d -a 2 "shots/$n.b64" "shots/$n.part."
            total=$(ls shots/$n.part.* | wc -l); i=0
            for part in shots/$n.part.*; do
              i=$((i+1))
              { echo '```'; cat "$part"; echo; echo '```'; } > shots/body.md
              gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name="AdLease screenshot $n ($i/$total)" \
                -f head_sha="$SHA" -f status=completed -f conclusion=neutral \
                -f "output[title]=$n, part $i of $total (JPEG, base64)" -F "output[summary]=@shots/body.md" > /dev/null
            done
          done

      - name: dart format (every committed Dart file in the app)
        id: format
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          # All tracked .dart files under adlease/ (lib and test). Files made by
          # flutter gen-l10n are git-ignored, so they are not included.
          files=$(git ls-files -- '*.dart')
          echo "Checked $(echo "$files" | wc -l) files" | tee ../format.txt
          [ -n "$files" ] || { echo "no Dart files found" | tee -a ../format.txt; exit 1; }
          dart format $files 2>&1 | tail -2 | tee -a ../format.txt
          git diff --stat -- . | tee -a ../format.txt
          git diff -- . > ../format.diff
          git diff --quiet -- .

      - name: Post reports
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ matrix.flutter }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LOCK: ${{ steps.lock.outcome }}
          PUB: ${{ steps.pub.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          FORMAT: ${{ steps.format.outcome }}
        run: |
          section() { echo "## $1"; echo '```'; if [ -f "$2" ]; then tail -n "$3" "$2"; else echo "(not run)"; fi; echo '```'; }
          summary="lock=$LOCK pub=$PUB analyze=$ANALYZE test=$TEST build=$BUILD format=$FORMAT"
          {
            echo "RESULT $summary"
            section versions versions.txt 10
            section "apk sdk levels (aapt2 dump badging)" sdk.txt 10
            section "committed lockfile" lock.txt 30
            section "dependencies" pub.txt 60
            section "flutter analyze" analyze.txt 150
            section "flutter test (summary)" test-summary.txt 400
            section "layout survey (other screens)" layout-survey.txt 120
            section "flutter test (last lines)" test.txt 25
            section "flutter build apk --debug" build.txt 40
            section "dart format" format.txt 40
          } > report.md
          post() {  # name conclusion title summary-file
            head -c 65000 "$4" > "$4.trim"
            gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name="$1" -f head_sha="$SHA" \
              -f status=completed -f conclusion="$2" -f "output[title]=$3" \
              -F "output[summary]=@$4.trim" > /dev/null
          }
          conclusion=success
          for o in "$LOCK" "$PUB" "$ANALYZE" "$TEST" "$BUILD" "$FORMAT"; do [ "$o" = success ] || conclusion=failure; done
          post "AdLease report (Flutter $V)" "$conclusion" "$summary" report.md
          if [ "$LOCK" != success ] && [ "$PUB" = success ]; then
            { echo '```yaml'; cat adlease/pubspec.lock; echo '```'; } > lock.md
            post "AdLease resolved pubspec.lock (Flutter $V)" neutral "pubspec.lock resolved by Flutter $V" lock.md
          fi
          if [ "$FORMAT" = failure ] && [ -s format.diff ]; then
            # gzip + base64 so the whole patch fits in one check report.
            { echo '```'; gzip -9c format.diff | base64 -w 120; echo '```'; } > fmt.md
            post "AdLease dart format changes (Flutter $V)" neutral "dart format changes needed" fmt.md
          fi
          [ "$conclusion" = success ]

  admin-dashboard:
    name: Admin dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adlease/admin-dashboard
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci
        id: ci
        continue-on-error: true
        run: |
          set -o pipefail
          { node --version; npm --version; } | tee "$GITHUB_WORKSPACE/admin.txt"
          npm ci --no-audit --no-fund 2>&1 | tee -a "$GITHUB_WORKSPACE/admin.txt"
      - name: npm run build
        id: build
        if: steps.ci.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a "$GITHUB_WORKSPACE/admin.txt"
      - name: Post report
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_OUT: ${{ steps.ci.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          conclusion=success
          if [ "$CI_OUT" != success ] || [ "$BUILD" != success ]; then conclusion=failure; fi
          { echo "RESULT npm_ci=$CI_OUT build=$BUILD"; echo '```'; tail -n 60 "$GITHUB_WORKSPACE/admin.txt" || true; echo '```'; } > admin.md
          if ! gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name="AdLease report (admin dashboard)" -f head_sha="$SHA" \
              -f status=completed -f conclusion="$conclusion" -f "output[title]=npm ci=$CI_OUT build=$BUILD" \
              -F "output[summary]=@admin.md" > post.log 2>&1; then
            echo "::error title=admin report post failed::$(head -c 800 post.log | tr '\n' ' ')"
          fi
          if [ "$conclusion" != success ]; then
            echo "::error title=admin build [npm ci=$CI_OUT build=$BUILD]::$(tail -c 1500 "$GITHUB_WORKSPACE/admin.txt" | tr '\n' ' ')"
            exit 1
          fi
