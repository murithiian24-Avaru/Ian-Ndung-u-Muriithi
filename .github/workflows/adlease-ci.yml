# AdLease validation: dependency resolution, static analysis, unit/widget tests
# and an Android DEBUG build. It never deploys, signs a release, or uses
# repository secrets. Each run posts a plain-text report as a separate check
# ("AdLease report ...") on the commit, and keeps the debug APK as an artifact.
name: AdLease CI

on:
  push:
    branches: [fix/adlease-validation]
    paths: ['adlease/**', '.github/workflows/adlease-ci.yml']
  pull_request:
    paths: ['adlease/**', '.github/workflows/adlease-ci.yml']
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # only to post the text report as a check on the commit

concurrency:
  group: adlease-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.27.4: the version the project was created with (README, Dart ^3.6.2).
        # stable: today's Flutter, to catch upgrade breakage early.
        flutter: ['3.27.4', 'stable']
    defaults:
      run:
        working-directory: adlease
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned)
        if: matrix.flutter != 'stable'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Set up Flutter (latest stable)
        if: matrix.flutter == 'stable'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          set -o pipefail
          { flutter --version; java -version 2>&1 | head -1; } | tee ../versions.txt

      - name: flutter pub get
        id: pub
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ matrix.flutter }}" = stable ]; then
            # The committed pubspec.lock is resolved for Flutter 3.27.4. On current
            # Flutter, re-resolve within pubspec.yaml's constraints (this runner
            # only; the committed lock is not changed) to measure upgrade readiness.
            flutter pub upgrade 2>&1 | tee ../pub.txt
          else
            flutter pub get --enforce-lockfile 2>&1 | tee ../pub.txt
          fi
          # Generate lib/l10n/app_localizations*.dart. Current Flutter does this in
          # pub get; Flutter 3.27 only does it during a build, so do it explicitly.
          flutter gen-l10n 2>&1 | tee -a ../pub.txt

      - name: flutter analyze
        id: analyze
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.txt

      - name: flutter test
        id: test
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ../test.txt

      - name: flutter build apk --debug
        id: build
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ../build.txt
          ls -l build/app/outputs/flutter-apk/app-debug.apk | tee -a ../build.txt

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: adlease-debug-apk-flutter-${{ matrix.flutter }}
          path: adlease/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Post report
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ matrix.flutter }}
          PUB: ${{ steps.pub.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          section() { echo "## $1"; echo '```'; if [ -f "$2" ]; then tail -n "$3" "$2"; else echo "(not run)"; fi; echo '```'; }
          {
            echo "RESULT pub=$PUB analyze=$ANALYZE test=$TEST build=$BUILD"
            section versions versions.txt 10
            section "flutter pub get" pub.txt 40
            section "flutter analyze" analyze.txt 150
            section "flutter test" test.txt 120
            section "flutter build apk --debug" build.txt 60
          } > report.md
          head -c 60000 report.md > report-trim.md
          conclusion=success
          for o in "$PUB" "$ANALYZE" "$TEST" "$BUILD"; do [ "$o" = success ] || conclusion=failure; done
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="AdLease report (Flutter $V)" -f head_sha="$SHA" \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=pub=$PUB analyze=$ANALYZE test=$TEST build=$BUILD" \
            -F "output[summary]=@report-trim.md" > /dev/null
          [ "$conclusion" = success ]
