name: AdLease Release Signing Validation

on:
  pull_request:
    paths:
      - 'adlease/android/**'
      - 'adlease/docs/PLAY_STORE_RELEASE_SIGNING.md'
      - 'adlease/docs/PLAY_STORE_RELEASE_CHECKLIST.md'
      - '.github/workflows/adlease-release-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-signing:
    name: Validate release signing with disposable CI key
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: adlease
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Generate disposable CI-only upload keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore android/adlease-upload.jks \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias adlease-upload \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=AdLease Disposable CI Key,O=Avaru CI,C=KE"
          cat > android/key.properties <<'EOF'
          storePassword=ci-only-password
          keyPassword=ci-only-password
          keyAlias=adlease-upload
          storeFile=../adlease-upload.jks
          EOF
      - name: Build signed release App Bundle
        run: |
          flutter pub get --enforce-lockfile
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
      - name: Verify bundle signature and upload certificate
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab
      - name: Remove disposable signing material
        if: always()
        run: |
          rm -f android/key.properties android/adlease-upload.jks
